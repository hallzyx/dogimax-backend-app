# Configuracion de Prueba - H2 Database en Memoria
# Usa este perfil para probar sin MySQL: --spring.profiles.active=test

# Server Configuration
server.port=8080

# H2 Database Configuration (en memoria - no requiere instalacion)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

# H2 Console (opcional - para ver la base de datos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Application Configuration
spring.application.name=dogimax-api

# Security - Deshabilitada para pruebas (SOLO PARA TEST)
# En produccion debe estar habilitada

